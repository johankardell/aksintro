apiVersion: v1
kind: Namespace
metadata:
  name: monitoring-demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: telemetry-demo
  namespace: monitoring-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: telemetry-demo
  template:
    metadata:
      labels:
        app: telemetry-demo
    spec:
      containers:
        - name: app
          image: busybox:1.37
          command:
            - sh
            - -c
            - |
              while true; do
                printf 'AKS monitoring lab: app is running\n'
                sleep 10
              done
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi

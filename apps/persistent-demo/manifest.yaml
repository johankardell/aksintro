apiVersion: v1
kind: Namespace
metadata:
  name: storage-demo
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: web-content
  namespace: storage-demo
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: managed-csi
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: persistent-web
  namespace: storage-demo
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: persistent-web
  template:
    metadata:
      labels:
        app: persistent-web
    spec:
      initContainers:
        - name: initialize-content
          image: busybox:1.37
          command:
            - sh
            - -c
            - |
              if [ ! -f /data/index.html ]; then
                printf 'Hello from a persistent Azure Disk!\n' > /data/index.html
              fi
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
          volumeMounts:
            - name: content
              mountPath: /data
      containers:
        - name: web
          image: nginx:1.28-alpine
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
          livenessProbe:
            httpGet:
              path: /
              port: http
          volumeMounts:
            - name: content
              mountPath: /usr/share/nginx/html
      volumes:
        - name: content
          persistentVolumeClaim:
            claimName: web-content
---
apiVersion: v1
kind: Service
metadata:
  name: persistent-web
  namespace: storage-demo
spec:
  type: ClusterIP
  selector:
    app: persistent-web
  ports:
    - name: http
      port: 80
      targetPort: http
